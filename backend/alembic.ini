# Alembic config — NeoBusiness AI
# Run from backend/: alembic upgrade head
# Generate: alembic revision --autogenerate -m "describe_change"
# See scripts/init_alembic.py for a short walkthrough.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden at runtime by alembic/env.py from config.settings.DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
